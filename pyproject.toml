[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "CLUEstering"
version = "2.13.0"
description = "High-Performance Density-Based Weighted Clustering for Heterogeneous Computing"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  {name = "Simone Balducci, Felice Pantaleo, Marco Rovere, Wahid Redjeb, Aurora Perego, Francesco Giacomini", email = "simone.balducci00@gmail.com"},
]
requires-python = ">=3.9"
dependencies = ["scikit-learn", "numpy", "matplotlib", "pandas"]
keywords = ["Density-based Weighted Clustering", "HPC", "Parallel Computing", "GPU Computing", "Performance Portability"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Unix",
  "Operating System :: MacOS :: MacOS X",
]

[tool.scikit-build]
cmake.args = ["-DBUILD_PYTHON=ON"]
cmake.build-type = "Release"
wheel.packages = ["CLUEstering"]
# only install the Python modules: the C++ headers and the CMake config files are not needed
install.components = ["python"]
# the sources of the bindings are already compiled into the modules
wheel.exclude = ["CLUEstering/BindingModules/**"]
sdist.exclude = [
  "benchmark",
  "data",
  "docs",
  "docker",
  "examples",
  "tests",
  "scripts",
  ".github",
  "extern/doxygen-awesome-css",
  "Doxyfile",
  "CONTRIBUTING.md",
  ".clang-format",
  ".clang-tidy",
  ".clangd",
  ".cmake-format.yml",
  ".pylintrc",
  ".coveragerc",
  ".codecov.yml",
  ".zenodo.json",
  ".env",
]

[tool.cibuildwheel]
# free-threaded builds would need a dedicated nanobind module (FREE_THREADED)
skip = ["*-musllinux_*", "cp3*t-*"]
test-requires = ["pytest"]
test-command = "python {project}/scripts/test_wheel.py {project} -- -x"
# the wheels are distributed, so don't optimize for the build machine
config-settings = { "cmake.define.CLUE_NATIVE_ARCH" = "OFF" }

[tool.cibuildwheel.linux]
archs = ["native"]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
before-all = "dnf install -y boost-devel"
# AppleClang has no OpenMP, so only require it on Linux
test-command = "python {project}/scripts/test_wheel.py {project} --require-backend 'cpu openmp' -- -x"

[tool.cibuildwheel.macos]
before-all = "brew install boost"

[tool.autopep8]
max_line_length = 108
in-place = true
aggressive = 2
