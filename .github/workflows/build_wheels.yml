name: Build and publish

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: &wheel-paths
      - "include/**"
      - "CLUEstering/**"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "cmake/**"
      - "pyproject.toml"
      - "scripts/test_wheel.py"
      - ".github/workflows/build_wheels.yml"
  pull_request:
    branches: [main]
    paths: *wheel-paths

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build wheels
        run: pipx run cibuildwheel==4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check that the SDist builds
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev libboost-atomic-dev
          python -m pip install dist/*.tar.gz
          cd /tmp && python -c "import CLUEstering; print(CLUEstering.backends)"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_testpypi:
    name: Upload to TestPyPI
    needs: [build_wheels, make_sdist]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, make_sdist]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "The release tag ($GITHUB_REF_NAME) does not match the package version ($version)"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
